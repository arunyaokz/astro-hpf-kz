name: HPF.kz SEO Automated Ops

on:
  schedule:
    # Daily 08:30 Asia/Almaty (UTC+5 -> 03:30 UTC): cache warm + SEO health briefing
    - cron: "30 3 * * *"
    # Weekly Monday 09:00 Asia/Almaty (UTC+5 -> 04:00 UTC): D1/SEO/conversion weekly digest
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (daily, weekly, or both)"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - both

permissions:
  contents: read

jobs:
  daily-audit:
    if: >-
      github.event.schedule == '30 3 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'daily' || inputs.mode == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Warm edge cache & run daily SEO audit
        env:
          WECOM_SEO_WEBHOOK: ${{ secrets.WECOM_SEO_WEBHOOK }}
        run: node scripts/seo-daily-audit.mjs --warm-cache --write-report
      - name: Upload daily SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-daily-report
          path: ops/seo-reports/
          retention-days: 30

  weekly-digest:
    if: >-
      github.event.schedule == '0 4 * * 1' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'weekly' || inputs.mode == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler CLI
        run: npm ci --ignore-scripts
      - name: Generate weekly SEO & conversion digest
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WECOM_SEO_WEBHOOK: ${{ secrets.WECOM_SEO_WEBHOOK }}
        run: node scripts/seo-weekly-digest.mjs --write-report
      - name: Upload weekly SEO digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-weekly-digest
          path: ops/seo-reports/
          retention-days: 90
